[project]
authors = [{name = "Alban Farchi", email = "alban.farchi@enpc.fr"}]
dependencies = []
name = "daaf-plot"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
daaf_plot = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cartopy = ">=0.25.0,<0.26"
ipympl = ">=0.9.7,<0.10"
ipython = ">=9.5.0,<10"
ipywidgets = ">=8.1.7,<9"
matplotlib = ">=3.10.6,<4"
numpy = ">=2.3.3,<3"
pandas = ">=2.3.2,<3"
xarray = ">=2025.9.0,<2026"
jupyter = ">=1.1.1,<2"
pixi-pycharm = ">=0.0.9,<0.0.10"

[tool.pixi.feature.dev.dependencies]
mypy = "*"
ruff = "*"

[tool.pixi.feature.doc.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
nbsphinx = "*"
sphinx-gallery = "*"
tomli = "*"
m2r2 = "*"
ipython = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "doc" }

[dependency-groups]
dev = ["bumpver>=2025.1131,<2026", "wemake-python-styleguide"]
