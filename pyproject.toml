[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    {name = "Alban Farchi", email = "alban.farchi@ecmwf.int"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "cartopy",
    "ipympl",
    "ipython",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "pandas",
    "xarray",
]
description = "Personal python toolbox to make interactive plot in python notebooks"
name = "daaf-plot"
readme = "README.md"
requires-python = ">= 3.11"
version = "1.1.0"
keywords = [
    "visualization",
    "interactive plots",
    "notebooks",
]

[project.urls]
Issues = "https://github.com/aFarchi/daaf-plot/issues"
Source = "https://github.com/aFarchi/daaf-plot"

[tool.ruff]
preview = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 12
pydocstyle.convention = "google"
select = ["ALL"]
ignore = [
    # no anotations
    "ANN",
    # no copyright on files
    "CPY001",
    # no docstrings
    "D",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
daaf_plot = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check"
format = "ruff format --config \"lint.ignore = ['COM812']\""
jl = "jupyter lab --no-browser"

[tool.pixi.dependencies]
cartopy = ">=0.25.0,<0.26"
ipympl = ">=0.10.0,<0.11"
ipython = ">=9.13.0,<10"
ipywidgets = ">=8.1.8,<9"
matplotlib = ">=3.10.9,<4"
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
xarray = ">=2026.4.0,<2027"
pixi-pycharm = ">=0.0.11,<0.0.12"
mypy = ">=1.20.2,<2"
ruff = ">=0.15.12,<0.16"
netcdf4 = ">=1.7.4,<2"
ipykernel = ">=7.2.0,<8"
jupyterlab = ">=4.5.7,<5"
